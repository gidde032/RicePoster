name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # tests/test_frontend_robustness.py parses frontend/index.html's script
      # block and skips when node is absent. The runner image happens to ship
      # node today, so this pins it rather than leaving the only non-grep
      # frontend check dependent on an incidental image detail.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests and enforce coverage floor
        run: python -m pytest tests/ -q -ra --cov=backend --cov-fail-under=43
